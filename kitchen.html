<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartOrder Kitchen</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f3f4f6;color:#111827;}
header{background:#111827;color:white;padding:14px;position:sticky;top:0;z-index:10;}
h1{margin:0;font-size:22px;}
.wrap{padding:12px;max-width:1000px;margin:auto;}
.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.row{display:flex;gap:8px;flex-wrap:wrap;}
button{padding:12px;border-radius:10px;border:none;font-size:16px;font-weight:bold;color:white;background:#2563eb;cursor:pointer;}
button.green{background:#16a34a;}
button.red{background:#dc2626;}
button.gray{background:#6b7280;}
button.black{background:#111827;}
.small{font-size:13px;color:#666;}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#e5e7eb;margin:2px;}
.orderCard{border-left:8px solid #2563eb;}
.order-paid{border-left-color:#16a34a;background:#ecfdf5;}
.order-ready{border-left-color:#f97316;background:#fff7ed;}
.item{border-radius:10px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer;border:2px solid transparent;}
.item.done{border-color:#16a34a;opacity:.75;}
.drink{background:#dbeafe;}
.food{background:#ffedd5;}
.other{background:#e5e7eb;}
.check{font-size:24px;font-weight:bold;color:#16a34a;}
.total{text-align:right;font-size:20px;font-weight:bold;margin-top:10px;}
.notice{padding:10px;border-radius:10px;background:#fef3c7;margin-bottom:10px;}
.topnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
</style>
</head>

<body>

<header>
  <h1>SmartOrder Kitchen</h1>
  <div id="shopInfo" class="small">読み込み中...</div>
  <div class="topnav">
    <button class="gray" onclick="openAdmin()">管理画面</button>
    <button class="black" onclick="logout()">ログアウト</button>
  </div>
</header>

<div class="wrap">
  <div class="notice">
    注文ごとに「お会計済み」。メニューをタップすると完成チェック。全メニューに✅が付くと「提供済み」ボタンが表示されます。
  </div>

  <div id="orders">注文を読み込み中...</div>
</div>

<script>
const firebaseConfig = {
  databaseURL: "https://smartorder-e65ab-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
let shopCode = params.get("shop") || sessionStorage.getItem("smartOrderShopCode") || "";

let settingsData = {};
let ordersData = {};

if(!shopCode || sessionStorage.getItem("smartOrderLoggedIn") !== "true"){
  location.href = "index.html";
}

function yen(v){
  return "¥" + Number(v || 0).toLocaleString();
}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, s => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[s]));
}

function categoryLabel(cat){
  if(cat === "drink") return "ドリンク";
  if(cat === "food") return "フード";
  return "その他";
}

function loadShop(){
  db.ref("shops/" + shopCode + "/settings").on("value", snap => {
    settingsData = snap.val() || {};
    document.getElementById("shopInfo").innerText =
      "店舗：" + (settingsData.shopName || shopCode) + " / shopCode：" + shopCode;
  });

  db.ref("shops/" + shopCode + "/orders").on("value", snap => {
    ordersData = snap.val() || {};
    renderOrders();
  });
}

function renderOrders(){
  const box = document.getElementById("orders");
  box.innerHTML = "";

  const list = Object.entries(ordersData)
    .filter(([id, order]) => {
      const status = order.status || "new";
      return status !== "provided" && status !== "canceled";
    })
    .sort((a,b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  if(list.length === 0){
    box.innerHTML = "<div class='card'>表示中の注文はありません。</div>";
    return;
  }

  list.forEach(([orderId, order]) => {
    const items = order.items || {};
    const itemEntries = Object.entries(items);
    const allDone = itemEntries.length > 0 && itemEntries.every(([itemId, item]) => item.done === true);
    const paid = order.paid === true;

    let itemsHtml = "";

    itemEntries.forEach(([itemId, item]) => {
      const done = item.done === true;

      itemsHtml += `
        <div class="item ${item.category || "other"} ${done ? "done" : ""}"
             onclick="toggleItemDone('${orderId}', '${itemId}', ${done ? "true" : "false"})">
          <div>
            <b>${esc(item.menuNumber || "")} ${esc(item.name || "")}</b><br>
            <span class="small">${categoryLabel(item.category)} / 数量：${item.qty || 0}</span>
          </div>
          <div>
            ${done ? "<span class='check'>✅</span>" : "<span class='small'>タップで完成</span>"}
          </div>
        </div>
      `;
    });

    const orderTypeLabel = order.orderType === "eatIn" ? "イートイン" : "テイクアウト";
    const createdText = order.createdAt ? new Date(order.createdAt).toLocaleString("ja-JP") : "-";

    const div = document.createElement("div");
    div.className = "card orderCard " + (allDone ? "order-ready " : "") + (paid ? "order-paid" : "");

    div.innerHTML = `
      <h2>${esc(order.customerName || "名無し")}</h2>

      <div>
        <span class="badge">${orderTypeLabel}</span>
        ${order.tableNo ? `<span class="badge">テーブル ${esc(order.tableNo)}</span>` : ""}
        <span class="badge">${paid ? "お会計済み" : "未会計"}</span>
        ${allDone ? `<span class="badge">全メニュー完成</span>` : ""}
      </div>

      <div class="small">${createdText}</div>

      ${itemsHtml}

      <div class="total">
        税込 ${yen(order.totalInTax)}<br>
        <span class="small">税抜 ${yen(order.totalExTax)} / 消費税 ${yen(order.totalTax)}</span>
      </div>

      <div class="row" style="margin-top:12px;">
        ${
          paid
          ? `<button class="green" onclick="setUnpaid('${orderId}')">お会計済み ✅</button>`
          : `<button class="green" onclick="setPaid('${orderId}')">お会計済みにする</button>`
        }

        ${
          allDone
          ? `<button class="gray" onclick="setProvided('${orderId}')">提供済み</button>`
          : ``
        }

        <button class="red" onclick="cancelOrder('${orderId}')">キャンセル</button>
        <button class="black" onclick="printReceipt('${orderId}')">領収書PDF</button>
      </div>
    `;

    box.appendChild(div);
  });
}

function setPaid(orderId){
  db.ref("shops/" + shopCode + "/orders/" + orderId).update({
    paid: true,
    status: "paid",
    paidAt: Date.now(),
    updatedAt: Date.now()
  });
}

function setUnpaid(orderId){
  db.ref("shops/" + shopCode + "/orders/" + orderId).update({
    paid: false,
    status: "new",
    paidAt: null,
    updatedAt: Date.now()
  });
}

function toggleItemDone(orderId, itemId, current){
  db.ref("shops/" + shopCode + "/orders/" + orderId + "/items/" + itemId).update({
    done: !current,
    doneAt: !current ? Date.now() : null
  });
}

function setProvided(orderId){
  if(!confirm("この注文を提供済みにして一覧から消しますか？")) return;

  db.ref("shops/" + shopCode + "/orders/" + orderId).update({
    status: "provided",
    providedAt: Date.now(),
    hideAt: Date.now(),
    updatedAt: Date.now()
  });
}

function cancelOrder(orderId){
  if(!confirm("この注文をキャンセルして一覧から消しますか？")) return;

  db.ref("shops/" + shopCode + "/orders/" + orderId).update({
    status: "canceled",
    canceledAt: Date.now(),
    hideAt: Date.now(),
    updatedAt: Date.now()
  });
}

function printReceipt(orderId){
  const order = ordersData[orderId];
  if(!order){
    alert("注文データがありません。");
    return;
  }

  let itemsHtml = "";
  Object.values(order.items || {}).forEach(item => {
    itemsHtml += `
      <tr>
        <td>${esc(item.name || "")}</td>
        <td>${item.qty || 0}</td>
        <td>${yen(item.priceInTax)}</td>
        <td>${yen(item.subtotalInTax)}</td>
      </tr>
    `;
  });

  const w = window.open("", "_blank");
  w.document.write(`
    <html>
    <head>
      <title>領収書</title>
      <style>
        body{font-family:sans-serif;padding:24px;}
        h1{text-align:center;}
        table{width:100%;border-collapse:collapse;margin-top:16px;}
        th,td{border:1px solid #333;padding:8px;text-align:left;}
        .right{text-align:right;}
        .small{font-size:12px;color:#555;}
      </style>
    </head>
    <body>
      <h1>領収書</h1>
      <p>店舗名：${esc(settingsData.shopName || shopCode)}</p>
      <p>インボイス番号：${esc(settingsData.invoiceNumber || "未設定")}</p>
      <p>発行日：${new Date().toLocaleString("ja-JP")}</p>
      <p>お客様名：${esc(order.customerName || "")}</p>

      <table>
        <tr><th>商品</th><th>数量</th><th>単価</th><th>小計</th></tr>
        ${itemsHtml}
      </table>

      <h2 class="right">合計 ${yen(order.totalInTax)}</h2>
      <p class="right">税抜 ${yen(order.totalExTax)} / 消費税 ${yen(order.totalTax)}</p>
      <p class="small">※店頭払い・受け取り時払い</p>

      <script>
        window.onload = function(){ window.print(); }
      <\/script>
    </body>
    </html>
  `);
  w.document.close();
}

function openAdmin(){
  location.href = "admin.html?shop=" + encodeURIComponent(shopCode);
}

function logout(){
  sessionStorage.removeItem("smartOrderShopCode");
  sessionStorage.removeItem("smartOrderLoggedIn");
  location.href = "index.html";
}

loadShop();
</script>

</body>
</html>
